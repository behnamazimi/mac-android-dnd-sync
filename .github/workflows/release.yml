name: Release

# Builds the dogfood ship artifacts (notarized Mac .dmg, signed Android
# .apk) and attaches them to a GitHub Release. Triggers ONLY on a version
# tag push — never on pull_request — so a fork PR can never reach the
# signing secrets below; only someone who can push tags to this repo can.
#
# `environment: release` additionally requires a human to approve each run
# before it touches secrets (configure this once: repo Settings →
# Environments → New environment "release" → Required reviewers). Actions
# are pinned to commit SHAs, not floating version tags, so a compromised
# upstream Action can't silently change what runs here.
#
# Required repo secrets (see CONTRIBUTING.md "Ship" for what each one is and how to
# get it — none of this is generated by CI, all of it comes from your own
# machine's existing signing setup):
#   MACOS_CERTIFICATE_P12_BASE64   base64 of your Developer ID Application
#                                  .p12 (cert + private key), e.g.
#                                  `base64 -i DeveloperID.p12 | pbcopy`
#   MACOS_CERTIFICATE_PASSWORD    password you set exporting that .p12
#   MACOS_KEYCHAIN_PASSWORD       any new random password — only unlocks
#                                  the throwaway keychain this run creates
#   APPLE_TEAM_ID                 from apps/macos/ExportOptions-DeveloperID.plist
#   NOTARY_APPLE_ID               Apple ID email used for notarization
#   NOTARY_APP_SPECIFIC_PASSWORD  from appleid.apple.com, not your real password
#   ANDROID_KEYSTORE_BASE64       `base64 -i apps/android/release.keystore.jks`
#   ANDROID_KEYSTORE_PASSWORD     from apps/android/local.properties
#                                  (dndsync.release.storePassword — same
#                                  value as keyPassword, see make android-keystore)
#   ANDROID_KEY_ALIAS             from apps/android/local.properties
#                                  (dndsync.release.keyAlias)
#   MACOS_PROVISIONING_PROFILE_BASE64
#                                  Developer ID Mac provisioning profile for
#                                  com.dndsyncapp.macos (Push requires one).
#                                  `base64 -i Foo.provisionprofile | pbcopy`
#   FORWARDER_APP_KEY              Same APP_KEY as the Cloud Function secret.
#                                  Baked into the Mac binary so the QR step
#                                  can POST /v1/pairs. From
#                                  ForwarderSecrets.local.swift (appKey).
#   FORWARDER_BASE_URL             Optional. Defaults to
#                                  https://europe-west1-dnd-sync-2a05c.cloudfunctions.net/api
#   ANDROID_GOOGLE_SERVICES_JSON_BASE64
#                                  `base64 -i apps/android/app/google-services.json | pbcopy`
#                                  Without it the release APK never registers FCM.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    name: Mac — archive, notarize, DMG
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true

      - name: Generate protobuf stubs
        run: ./scripts/generate-proto.sh

      - name: Import Developer ID certificate into a throwaway keychain
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="release-$GITHUB_RUN_ID.keychain-db"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          # shellcheck disable=SC2046 # intentional: append each existing
          # keychain (one per line) as its own -s argument, not one blob
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Install Developer ID provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${PROFILE_BASE64:-}" ]; then
            printf 'Missing MACOS_PROVISIONING_PROFILE_BASE64. Create a Developer ID provisioning profile for com.dndsyncapp.macos in the Apple Developer portal, then: base64 -i Profile.provisionprofile | pbcopy\n' >&2
            exit 1
          fi
          tmp="$RUNNER_TEMP/dndsync.provisionprofile"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$tmp"
          uuid="$(security cms -D -i "$tmp" | plutil -extract UUID raw -)"
          name="$(security cms -D -i "$tmp" | plutil -extract Name raw -)"
          dest_new="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          dest_old="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dest_new" "$dest_old"
          cp "$tmp" "$dest_new/$uuid.provisionprofile"
          cp "$tmp" "$dest_old/$uuid.provisionprofile"
          echo "MACOS_PROFILE_SPECIFIER=$name" >> "$GITHUB_ENV"
          echo "Installed Developer ID profile: $name ($uuid)"

      - name: Archive, export, notarize, staple, package DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
          FORWARDER_APP_KEY: ${{ secrets.FORWARDER_APP_KEY }}
          FORWARDER_BASE_URL: ${{ secrets.FORWARDER_BASE_URL }}
        run: make dmg-mac

      - name: Delete the throwaway keychain
        if: always()
        run: security delete-keychain "$RELEASE_KEYCHAIN" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-dmg
          path: build/mac/*.dmg
          if-no-files-found: error

  android:
    name: Android — signed release APK
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Restore google-services.json so release FCM can register
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf 'Missing ANDROID_GOOGLE_SERVICES_JSON_BASE64. Encode the Firebase Android app file: base64 -i apps/android/app/google-services.json | pbcopy\n' >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/android/app/google-services.json

      - name: Restore the release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > apps/android/release.keystore.jks
          {
            echo "dndsync.release.storeFile=release.keystore.jks"
            echo "dndsync.release.storePassword=$KEYSTORE_PASSWORD"
            echo "dndsync.release.keyAlias=$KEY_ALIAS"
            echo "dndsync.release.keyPassword=$KEYSTORE_PASSWORD"
          } >> apps/android/local.properties

      - name: Build signed release APK
        run: make build-android-release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: apps/android/app/build/outputs/apk/release/DNDSync-*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [mac, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Create the Release and attach both artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/mac-dmg/*.dmg \
            dist/android-apk/*.apk \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
