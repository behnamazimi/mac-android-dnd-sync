name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Code only: proto lint/generate, Android unit tests, forwarder typecheck +
# unit tests, then Mac unit tests unsigned. No FCM/APNs/LAN/Focus, no
# `firebase deploy`, no device. Those stay a human checklist (AGENTS.md
# "Live checks"). See AGENTS.md and the DevX automation inventory plan.
jobs:
  linux:
    name: Proto + Android + Forwarder (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # github_token defaults to github.token so the Buf CLI download is
      # authenticated (unauthenticated GitHub API calls from hosted runners
      # hit the shared IP rate limit). setup_only: install buf, then our
      # generate-proto.sh / Gradle task run lint+generate themselves.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # v3's default packages included the removed SDK `tools` package
      # (`Failed to find package 'tools'`). v4 installs platform-tools.
      - uses: android-actions/setup-android@v4

      - name: Android unit tests (proto + buf lint run as a Gradle dependency)
        run: make test-android

      - name: Forwarder typecheck + unit tests
        run: make test-forwarder

  macos:
    name: Mac unit tests (unsigned)
    # macos-14's default Xcode still treats SwiftUI View helpers as
    # nonisolated, so @MainActor model reads fail the build. macos-26
    # matches local Darwin 25 / Xcode 26, where this project compiles.
    # macos-14 images are also on GitHub's deprecation clock.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Generate protobuf stubs
        run: ./scripts/generate-proto.sh

      - name: xcodebuild test (no signing identity, no device)
        run: |
          xcodebuild -project apps/macos/DNDSync.xcodeproj -scheme DNDSync \
            -configuration Debug -destination 'platform=macOS' test \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
